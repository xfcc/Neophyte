<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Neophyte · 资产观察</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./assets/styles.css?v=13" />
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<main class="shell" id="main-content">
  <header class="topbar">
    <a class="brand" href="#allocation">Neophyte</a>
    <nav class="view-tabs" aria-label="内容视图">
      <a class="view-tab" href="#allocation" data-v2-tab="allocation" aria-current="page">资产配置</a>
      <a class="view-tab" href="#profit" data-v2-tab="profit">资产浮盈</a>
      <a class="view-tab" href="#volatility" data-v2-tab="volatility">波动识别</a>
    </nav>
  </header>
  <header class="hero v2-hero">
    <div><p class="eyebrow">PORTFOLIO OBSERVATION · 2.0</p><h1 id="v2-title">资产配置</h1><p id="v2-subtitle">观察实际结构与目标的关系</p></div>
    <label class="v2-date">估值日期 <select id="v2-date" aria-label="选择估值日期"><option>正在读取</option></select></label>
  </header>
  <p class="v2-status" id="v2-status" role="status">正在读取数据…</p>
  <div id="v2-coverage" class="v2-coverage"></div>
  <section data-v2-panel="allocation">
    <div id="v2-allocation-dashboard"></div>
  </section>
  <section data-v2-panel="profit" hidden>
    <section class="panel v2-panel"><div class="v2-toolbar"><h2>当前持仓浮盈</h2>
      <label>资产 <select id="v2-filter"><option value="all">全部</option><option value="equity">股票</option><option value="bond">债券</option><option value="cash">现金</option><option value="gold">黄金</option></select></label>
      <label>内部分类 <select id="v2-subfilter"><option value="all">全部内部分类</option></select></label>
      <label>比例分母 <select id="v2-weight"><option value="class_weight">所属资产分类</option><option value="global_weight">全账户</option></select></label>
      <label>排序 <select id="v2-sort"><option value="weight">持仓占比降序</option><option value="holding_return">浮盈收益率降序</option><option value="daily_return">日涨跌幅降序</option></select></label>
    </div><div id="v2-profit"></div><p class="section-note">当前持仓浮盈不代表完整投资绩效。按当前汇率折算，不含历史汇率损益；分类收益率按可比成本汇总，未含未分摊的账户费用。</p></section>
  </section>
  <section data-v2-panel="volatility" hidden>
    <section class="panel v2-panel"><h2>近5个有效交易日</h2><p class="section-note">按产品自身锁定历史分位分组，保留涨跌方向。单日变化为辅助信息。</p><div id="v2-volatility"></div></section>
    <section class="panel v2-panel"><h2>今日概览</h2><ul id="v2-daily-overview"></ul><h2>5日概览</h2><ul id="v2-five-overview"></ul></section>
  </section>
  <footer><span>Neophyte · 投资观察</span><span>配置偏离、浮盈与统计异常不自动导出交易结论</span></footer>
</main>
<script src="./assets/portfolio-v2.js"></script>
<script src="./assets/app.js"></script>
<script src="./assets/vendor/vchart-2.2.0/vchart.min.js"></script>
<script src="./assets/market-calendar.js?v=1"></script>
<script src="./assets/allocation-dashboard.js?v=14"></script>
<script src="./assets/app-v2.js?v=11"></script>
</body>
</html>
